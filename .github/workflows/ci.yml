name: CI

on:
  pull_request:
    branches: [dev, staging, main]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  branch-policy:
    name: Branch policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify PR target and required release files
        if: github.event_name == 'pull_request'
        run: python scripts/check_pr_policy.py
      - name: Manual runs do not certify PR routing
        if: github.event_name != 'pull_request'
        run: echo "PR routing is checked only on pull_request events."
  quality:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.22"
          enable-cache: true
      - run: uv sync --locked --python 3.14.4
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest tests/ -q
      - run: uv run pre-commit run --all-files
      - name: Prove large-file and fake-secret commits are rejected
        run: uv run python scripts/check_guardrails.py
  smoke:
    name: Data checks and smoke train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.22"
          enable-cache: true
      - run: uv sync --locked --python 3.14.4
      - name: Validate deterministic sample and execute prepare, train, evaluate
        run: uv run python -m src.smoke --output artifacts/smoke-metrics.json
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-smoke-metrics
          path: artifacts/smoke-metrics.json
