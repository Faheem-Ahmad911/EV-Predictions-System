seed: 42

data:
  raw_path: "data/raw/ev_charging_stations.csv"
  processed_dir: "data/processed"
  target_column: "cost_per_kwh_usd"

split:
  test_size: 0.2
  random_state: 42

train:
  model: "random_forest"
  n_estimators: 100
  max_depth: 10
  random_state: 42

evaluate:
  metrics_file: "metrics.json"
