[project]
name = "ev-predictions-system"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "dvc[gdrive]>=3.67.1",
    "joblib>=1.6.0",
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "jupytext>=1.19.5",
    "nbstripout>=0.9.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"
